spring.profiles.default=local

spring.application.name=backend

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicconnect_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civic_password}

# Hibernate & Flyway Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
server.port=8081

# Uploaded issue photos are stored outside the database.
app.upload.dir=${UPLOAD_DIR:${user.home}/.civicconnect/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Admin & Gemini bindings (set actual local values in git-ignored application-local.properties)
app.admin.username=${APP_ADMIN_USERNAME:${admin.username:admin}}
app.admin.password=${APP_ADMIN_PASSWORD:${admin.password:secretpassword}}
gemini.api.key=${GEMINI_API_KEY:}